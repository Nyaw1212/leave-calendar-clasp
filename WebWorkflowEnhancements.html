<style>
  .floating-add-leave{
    position:fixed;
    right:390px;
    bottom:22px;
    z-index:50;
    width:auto;
    min-width:230px;
    padding:12px 20px;
    border:0;
    border-radius:999px;
    background:var(--primary);
    color:#fff;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 28px rgba(26,115,232,.35);
  }
  .floating-add-leave:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(26,115,232,.42)}
  .floating-add-leave .count{margin-left:7px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.22)}
  .metric.live-metric{background:#eef6ff;border-color:#a8c7fa}
  .metric.live-metric strong{color:#0b57d0}
  .metric.live-metric.negative{background:#fce8e6;border-color:#f28b82}
  .metric.live-metric.negative strong{color:#b3261e}
  .selection-summary{margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#fafbfc;font-size:12px;color:var(--muted)}
  .selection-summary strong{color:#182230}
  .day.drag-preview{background:var(--selected);box-shadow:inset 0 0 0 2px var(--primary)}
  .day{user-select:none;-webkit-user-select:none}
  @media(max-width:900px){
    .floating-add-leave{left:14px;right:14px;bottom:88px;width:calc(100% - 28px)}
  }
</style>
<script>
(function(){
  let currentProfile={balanceVl:0,balanceSl:0};
  let dragging=false;
  let dragMoved=false;
  let dragStartKey='';

  function parseIso(key){
    const parts=String(key).split('-').map(Number);
    return new Date(parts[0],parts[1]-1,parts[2]);
  }

  function dayGap(a,b){
    return Math.round((parseIso(b)-parseIso(a))/86400000);
  }

  function groupDateKeys(keys){
    const sorted=Array.from(new Set(keys)).sort();
    const groups=[];
    sorted.forEach(key=>{
      const group=groups[groups.length-1];
      if(!group||dayGap(group[group.length-1],key)!==1)groups.push([key]);
      else group.push(key);
    });
    return groups;
  }

  function leaveTypeLabel(value){
    const map={
      VL:'Vacation Leave',SL:'Sick Leave',FL:'Forced Leave',
      SPL:'Special Privilege Leave',CTO:'Compensatory Time Off',
      ML:'Maternity Leave',PL:'Paternity Leave',Other:'Other'
    };
    return map[value]||value||'Other';
  }

  function draftTotals(){
    let vl=0,sl=0;
    (window.draft||draft||[]).forEach(entry=>{
      const total=(entry.dates||[]).reduce((sum,item)=>sum+Number(item.credits||0),0);
      const type=String(entry.leaveType||'').toUpperCase();
      if(['VL','FL','MONE'].includes(type))vl+=total;
      if(type==='SL')sl+=total;
    });
    return {vl,sl};
  }

  function renderLiveCredits(){
    const profile=document.getElementById('profile');
    if(!profile)return;
    const totals=draftTotals();
    const liveVl=Number(currentProfile.balanceVl||0)-totals.vl;
    const liveSl=Number(currentProfile.balanceSl||0)-totals.sl;

    profile.querySelectorAll('.live-metric').forEach(node=>node.remove());
    const currentMetrics=Array.from(profile.querySelectorAll('.metric'));
    if(currentMetrics.length<2)return;

    const vl=document.createElement('div');
    vl.className='metric live-metric'+(liveVl<0?' negative':'');
    vl.innerHTML='<span>Live VL</span><strong>'+liveVl.toFixed(3)+'</strong>';
    const sl=document.createElement('div');
    sl.className='metric live-metric'+(liveSl<0?' negative':'');
    sl.innerHTML='<span>Live SL</span><strong>'+liveSl.toFixed(3)+'</strong>';

    const currentVl=currentMetrics.find(node=>node.textContent.includes('Current VL'));
    profile.insertBefore(vl,currentVl||profile.firstChild);
    profile.insertBefore(sl,currentVl||profile.firstChild);
  }

  function selectedCount(){
    try{return selected.size||0}catch(error){return 0}
  }

  function selectedGroups(){
    try{return groupDateKeys(Array.from(selected))}catch(error){return []}
  }

  function ensureSelectionSummary(){
    if(document.getElementById('selectionSummary'))return;
    const controls=document.querySelector('.entry-controls');
    if(!controls)return;
    const summary=document.createElement('div');
    summary.id='selectionSummary';
    summary.className='selection-summary';
    controls.insertAdjacentElement('afterend',summary);
  }

  function refreshSelectionSummary(){
    ensureSelectionSummary();
    const el=document.getElementById('selectionSummary');
    if(!el)return;
    const groups=selectedGroups();
    const dates=selectedCount();
    const credits=Array.from(selected||[]).reduce((sum,key)=>sum+Number(dateCredit(key)||0),0);
    if(!dates){
      el.innerHTML='Pick individual dates or <strong>click and drag</strong> across the calendar, then press <strong>Enter Leave</strong>.';
      return;
    }
    el.innerHTML='<strong>'+dates+' selected date'+(dates===1?'':'s')+'</strong> · '+groups.length+' grouped period'+(groups.length===1?'':'s')+' · '+credits.toFixed(3)+' credits';
  }

  function ensureFloatingButton(){
    if(document.getElementById('floatingAddLeave'))return;
    const button=document.createElement('button');
    button.id='floatingAddLeave';
    button.type='button';
    button.className='floating-add-leave';
    button.innerHTML='Enter Leave <span class="count">0</span>';
    button.addEventListener('click',function(){window.addLeaveToDraft()});
    document.body.appendChild(button);
  }

  function refreshFloatingButton(){
    ensureFloatingButton();
    const count=document.querySelector('#floatingAddLeave .count');
    const groups=selectedGroups();
    if(count)count.textContent=selectedCount()?groups.length+' group'+(groups.length===1?'':'s'):'0';
    const primary=document.querySelector('button.primary');
    if(primary)primary.textContent='Enter Leave';
    refreshSelectionSummary();
  }

  function addGroupedLeaveToDraft(){
    if(!employee.value)return setStatus('Select an employee.','error');
    if(!assumptionDate.value)return setStatus('Enter and save the Date of Assumption first.','error');
    if(!selected.size)return setStatus('Select at least one date.','error');

    const remarks=document.getElementById('remarks').value.trim();
    const groups=selectedGroups();
    groups.forEach((keys,index)=>{
      draft.push({
        id:Date.now()+index,
        leaveType:leaveType.value,
        remarks,
        dates:keys.map(key=>({date:key,credits:dateCredit(key)}))
      });
    });

    selected.clear();
    document.getElementById('remarks').value='';
    renderDraft();
    renderMonths();
    setStatus(groups.length+' leave period'+(groups.length===1?'':'s')+' added to draft.','success');
  }

  function renderGroupedDraft(){
    const root=document.getElementById('draftEntries');
    if(!root)return;
    root.innerHTML='';
    let total=0;

    draft.forEach(entry=>{
      const credits=(entry.dates||[]).reduce((sum,item)=>sum+Number(item.credits||0),0);
      total+=credits;
      const first=entry.dates&&entry.dates[0]?entry.dates[0].date:'';
      const last=entry.dates&&entry.dates.length?entry.dates[entry.dates.length-1].date:first;
      const row=document.createElement('div');
      row.className='draft-entry';
      row.innerHTML='<div class="tag">'+String(entry.leaveType||'')+'</div>'+
        '<div><strong>'+leaveTypeLabel(entry.leaveType)+'</strong><br><span>'+first+(last&&last!==first?' → '+last:'')+'</span><br><small>'+(entry.dates||[]).length+' selected date(s)</small></div>'+
        '<div>'+credits.toFixed(3)+'</div>'+
        '<button class="delete" type="button">×</button>';
      row.querySelector('.delete').addEventListener('click',function(ev){deleteEntry(ev,entry.id)});
      root.appendChild(row);
    });

    document.getElementById('draftMeta').textContent=draft.length+' entr'+(draft.length===1?'y':'ies')+' · '+total.toFixed(3)+' credits';
    renderPanel();
    saveDraft();
    renderLiveCredits();
    refreshFloatingButton();
  }

  function renderDragMonths(){
    const root=document.getElementById('months');
    root.innerHTML='';

    for(let i=0;i<monthCount;i++){
      const dt=new Date(start.getFullYear(),start.getMonth()+i,1);
      const y=dt.getFullYear(),m=dt.getMonth(),first=dt.getDay();
      const days=new Date(y,m+1,0).getDate();
      const box=document.createElement('div');
      box.className='month';
      box.innerHTML='<h3>'+MONTHS[m]+' '+y+'</h3><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>';
      const grid=document.createElement('div');
      grid.className='days';

      for(let x=0;x<first;x++){
        const blank=document.createElement('button');
        blank.className='day empty';
        grid.appendChild(blank);
      }

      for(let d=1;d<=days;d++){
        const date=new Date(y,m,d),key=iso(y,m,d);
        const button=document.createElement('button');
        button.type='button';
        button.className='day';
        button.textContent=d;
        button.dataset.date=key;
        if(date.getDay()===0||date.getDay()===6)button.classList.add('weekend');
        if(holidays.has(key))button.classList.add('holiday');
        if(existing.has(key))button.classList.add('existing');
        if(selected.has(key))button.classList.add('selected');

        if(!existing.has(key)){
          button.addEventListener('pointerdown',function(ev){
            if(ev.pointerType==='mouse'&&ev.button!==0)return;
            dragging=true;
            dragMoved=false;
            dragStartKey=key;
          });
          button.addEventListener('pointerenter',function(){
            if(!dragging||key===dragStartKey)return;
            dragMoved=true;
            selected.add(key);
            button.classList.add('drag-preview','selected');
          });
          button.addEventListener('pointerup',function(){
            if(!dragging)return;
            if(dragMoved){
              selected.add(dragStartKey);
              selected.add(key);
            }else{
              selected.has(key)?selected.delete(key):selected.add(key);
            }
            dragging=false;
            dragMoved=false;
            renderDragMonths();
          });
        }
        grid.appendChild(button);
      }

      box.appendChild(grid);
      root.appendChild(box);
    }

    updateSelectedCredits();
    refreshFloatingButton();
  }

  document.addEventListener('pointerup',function(){
    if(!dragging)return;
    dragging=false;
    dragMoved=false;
  });

  document.addEventListener('keydown',function(event){
    if(event.key!=='Enter'||event.shiftKey||event.ctrlKey||event.altKey||event.metaKey)return;
    const tag=document.activeElement&&document.activeElement.tagName;
    if(tag==='TEXTAREA'||tag==='SELECT'||tag==='INPUT')return;
    if(selectedCount()>0){
      event.preventDefault();
      addGroupedLeaveToDraft();
    }
  });

  function alignTwelveMonthView(){
    if(Number(monthCount)!==12)return false;
    if(start.getMonth()===0)return false;
    start=new Date(start.getFullYear(),0,1);
    return true;
  }

  function wrapFunctions(){
    if(window.__workflowEnhancementsWrapped)return;
    window.__workflowEnhancementsWrapped=true;

    const originalRenderProfile=window.renderProfile;
    window.renderProfile=function(profile){
      if(profile)currentProfile=profile;
      originalRenderProfile.apply(this,arguments);
      renderLiveCredits();
    };

    window.addLeaveToDraft=addGroupedLeaveToDraft;
    window.renderDraft=renderGroupedDraft;
    window.renderMonths=renderDragMonths;

    const originalMoveMonths=window.moveMonths;
    window.moveMonths=function(amount){
      let adjusted=Number(amount)||0;
      if(Number(monthCount)===12&&Math.abs(adjusted)===1)adjusted*=12;
      originalMoveMonths(adjusted);
      if(Number(monthCount)===12&&start.getMonth()!==0){
        start=new Date(start.getFullYear(),0,1);
        load();
        saveDraft();
      }
    };
  }

  function attachTwelveMonthAlignment(){
    document.querySelectorAll('.views button[data-count]').forEach(button=>{
      if(button.dataset.yearAlignmentAttached==='yes')return;
      button.dataset.yearAlignmentAttached='yes';
      button.addEventListener('click',function(){
        if(Number(button.dataset.count)!==12)return;
        setTimeout(function(){
          if(alignTwelveMonthView()){
            load();
            saveDraft();
            const month=document.getElementById('jumpMonth');
            if(month)month.value='0';
          }
        },0);
      });
    });

    const go=document.getElementById('jumpGo');
    if(go&&go.dataset.yearAlignmentAttached!=='yes'){
      go.dataset.yearAlignmentAttached='yes';
      go.addEventListener('click',function(){
        setTimeout(function(){
          if(alignTwelveMonthView()){
            load();
            saveDraft();
            const month=document.getElementById('jumpMonth');
            if(month)month.value='0';
          }
        },0);
      });
    }
  }

  function init(){
    ensureFloatingButton();
    ensureSelectionSummary();
    wrapFunctions();
    attachTwelveMonthAlignment();
    if(Number(monthCount)===12&&alignTwelveMonthView()){
      load();
      saveDraft();
    }
    renderLiveCredits();
    refreshFloatingButton();
  }

  init();
  setTimeout(init,350);
})();
</script>
