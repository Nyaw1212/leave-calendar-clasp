<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; font-family: Arial, sans-serif; color: #202124; }
    h2 { margin: 0 0 6px; font-size: 19px; }
    p { margin: 0 0 14px; color: #5f6368; font-size: 12px; line-height: 1.45; }
    label { display: block; margin: 11px 0 5px; font-size: 12px; font-weight: 700; }
    input, textarea, button { width: 100%; font: inherit; }
    input, textarea { padding: 9px; border: 1px solid #dadce0; border-radius: 6px; }
    textarea { min-height: 185px; resize: vertical; font: 11px/1.45 Consolas, monospace; }
    .options { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; }
    .option { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .option input { width: auto; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { border: 0; border-radius: 6px; padding: 10px; background: #1a73e8; color: white; font-weight: 700; cursor: pointer; }
    button.secondary { background: #5f6368; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 10px; min-height: 18px; font-size: 12px; }
    #preview { margin-top: 11px; max-height: 180px; overflow: auto; border: 1px solid #dadce0; border-radius: 6px; background: #f8f9fa; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: 6px; border-bottom: 1px solid #e0e0e0; text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: #f1f3f4; }
    .success { color: #188038; }
    .error { color: #d93025; }
    .warning { color: #b06000; }
    .hint { margin-top: 7px; color: #5f6368; font-size: 10px; }
  </style>
</head>
<body>
  <h2>Paste Holiday Table</h2>
  <p>
    Copy the holiday rows from Timeanddate and paste them below. The parser stores them in the
    <strong>Holidays</strong> sheet, so the calendar never needs to revisit the website.
  </p>

  <label for="year">Holiday year</label>
  <input id="year" type="number" min="1980" max="2100" value="2000">

  <label for="sourceText">Copied holiday rows</label>
  <textarea id="sourceText" placeholder="1 Jan    Saturday    New Year's Day    Regular Holiday"></textarea>
  <div class="hint">Tab-separated text copied directly from the website works best.</div>

  <div class="options">
    <label class="option">
      <input id="regularOnly" type="checkbox" checked>
      Import Regular Holiday rows only
    </label>
    <label class="option">
      <input id="replaceYear" type="checkbox">
      Replace stored rows for this year
    </label>
  </div>

  <div class="actions">
    <button class="secondary" id="previewButton" onclick="previewRows()">Preview</button>
    <button id="importButton" onclick="importRows()">Import to Sheet</button>
  </div>

  <div id="status">Ready.</div>
  <div id="preview"><div style="padding:10px;color:#5f6368;font-size:11px;">No preview yet.</div></div>

  <script>
    function getPayload() {
      return {
        year: Number(document.getElementById('year').value),
        text: document.getElementById('sourceText').value,
        regularOnly: document.getElementById('regularOnly').checked,
        replaceYear: document.getElementById('replaceYear').checked
      };
    }

    function previewRows() {
      setLoading(true);
      setStatus('Parsing pasted rows...', '');
      google.script.run
        .withSuccessHandler(result => {
          setLoading(false);
          renderPreview(result);
          setStatus(
            `${result.parsed.length} row(s) recognized; ${result.rejected.length} line(s) rejected.`,
            result.rejected.length ? 'warning' : 'success'
          );
        })
        .withFailureHandler(handleError)
        .parseHolidayPaste(getPayload());
    }

    function importRows() {
      setLoading(true);
      setStatus('Saving holidays...', '');
      google.script.run
        .withSuccessHandler(result => {
          setLoading(false);
          setStatus(result.message, 'success');
          previewRows();
        })
        .withFailureHandler(handleError)
        .importHolidayPaste(getPayload());
    }

    function renderPreview(result) {
      const box = document.getElementById('preview');
      if (!result.parsed.length) {
        box.innerHTML = '<div style="padding:10px;color:#5f6368;font-size:11px;">No matching rows found.</div>';
        return;
      }

      const rows = result.parsed.map(item => `
        <tr>
          <td>${escapeHtml(item.date)}</td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.type)}</td>
        </tr>`).join('');

      box.innerHTML = `
        <table>
          <thead><tr><th>Date</th><th>Holiday</th><th>Type</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function setLoading(loading) {
      document.getElementById('previewButton').disabled = loading;
      document.getElementById('importButton').disabled = loading;
    }

    function handleError(error) {
      setLoading(false);
      setStatus(error.message || String(error), 'error');
    }

    function setStatus(message, className) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = className || '';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
