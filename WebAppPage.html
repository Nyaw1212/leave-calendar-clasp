<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--primary:#1a73e8;--navy:#08254b;--border:#dfe3e8;--muted:#667085;--green:#159455;--bg:#f6f8fb;--holiday:#fce8e6;--weekend:#f2f4f7;--selected:#dbeafe;--existing:#ede9fe}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#182230}header{padding:16px 24px;background:var(--navy);color:#fff;font-size:20px;font-weight:700}
    main{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 2px 7px rgba(16,24,40,.04)}
    label{display:block;margin-bottom:6px;font-size:12px;font-weight:700}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff}.toolbar{display:grid;grid-template-columns:2fr 1.15fr 1fr 1fr auto;gap:10px;align-items:end}.date-entry-wrap{display:grid;grid-template-columns:1fr auto;gap:6px}.save-date{padding:10px 12px;border:0;border-radius:8px;background:#5f6368;color:#fff;font-weight:700;cursor:pointer}.save-date:disabled{opacity:.55}.nav-btn{width:42px;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer}.views{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.views button{padding:9px 16px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer}.views .active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .profile{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric{padding:10px;border:1px solid var(--border);border-radius:9px;background:#fafbfc}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:18px}.service-note{grid-column:1/-1;font-size:11px;color:var(--muted)}.months{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px}.month{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff}.month h3{text-align:center;margin:2px 0 10px;font-size:15px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:10px;color:var(--muted);font-weight:700}.day{min-height:34px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer}.day.weekend{background:var(--weekend);color:#667085}.day.holiday{background:var(--holiday);border-color:#d93025;color:#b3261e;font-weight:700}.day.selected{background:var(--selected);box-shadow:inset 0 0 0 2px var(--primary)}.day.existing{background:var(--existing);cursor:not-allowed}.day.empty{visibility:hidden}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:11px;height:11px;border:1px solid var(--border);margin-right:4px;vertical-align:-1px}.entry-controls{display:grid;grid-template-columns:1fr 150px;gap:10px}.primary{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.status{min-height:18px;margin-top:8px;font-size:12px}.success{color:#188038}.error{color:#d93025}.warning{color:#b06000}
    .draft-panel{position:sticky;top:16px;overflow:hidden;max-height:76px;transition:max-height .25s ease,box-shadow .25s ease;cursor:pointer}.draft-panel.expanded{max-height:720px;box-shadow:0 12px 28px rgba(16,24,40,.14)}.draft-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.draft-title{font-weight:700}.draft-meta{font-size:12px;color:var(--muted);margin-top:4px}.pin{padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:#f2f4f7;cursor:pointer}.draft-panel.pinned .pin{background:#e8f1ff;color:#155eef}.draft-body{padding-top:12px;opacity:0;transform:translateY(-4px);transition:.18s;pointer-events:none}.draft-panel.expanded .draft-body{opacity:1;transform:none;pointer-events:auto}.draft-entry{display:grid;grid-template-columns:44px 1fr auto 28px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #edf0f3}.tag{text-align:center;padding:5px;border-radius:7px;background:#ece5ff;font-weight:700}.delete{border:0;background:transparent;color:#d93025;cursor:pointer}.draft-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.draft-actions button{padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer}.draft-actions .complete{grid-column:1/-1;background:var(--green);color:#fff;border:0;font-weight:700}.save-note{margin-top:12px;padding:10px;border-radius:8px;background:#ecfdf3;color:#067647;font-size:12px}
    @media(hover:hover) and (pointer:fine){.draft-panel:not(.pinned):hover{max-height:720px;box-shadow:0 12px 28px rgba(16,24,40,.14)}.draft-panel:not(.pinned):hover .draft-body{opacity:1;transform:none;pointer-events:auto}}
    @media(max-width:1200px){.toolbar{grid-template-columns:2fr 1.3fr 1fr}.toolbar .nav-btn{display:none}.months{grid-template-columns:repeat(2,minmax(240px,1fr))}.profile{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:900px){main{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.months{grid-template-columns:1fr}.draft-panel{position:fixed;left:12px;right:12px;bottom:12px;top:auto;z-index:20}body{padding-bottom:90px}}
  </style>
</head>
<body>
<header>Leave History Recorder · Web App</header>
<main>
  <section class="card">
    <div class="toolbar">
      <div><label for="employee">Employee</label><select id="employee"><option>Loading employees...</option></select></div>
      <div><label for="assumptionDate">Date of Assumption / Entry</label><div class="date-entry-wrap"><input id="assumptionDate" type="date" disabled><button id="saveDateButton" class="save-date" onclick="saveAssumptionDate()" disabled>Save Date</button></div></div>
      <div><label for="leaveType">Leave Type</label><select id="leaveType"><option value="VL">Vacation Leave (VL)</option><option value="SL">Sick Leave (SL)</option><option value="FL">Forced Leave (FL)</option><option value="SPL">Special Privilege Leave</option><option value="CTO">CTO</option><option value="Other">Other</option></select></div>
      <div><label for="credit">Credit</label><select id="credit"><option value="1">1.00 — Whole Day</option><option value="0.5">0.50 — Half Day</option></select></div>
      <button class="nav-btn" onclick="moveMonths(-1)">‹</button>
    </div>
    <div class="views"><button data-count="3" class="active">3 Months</button><button data-count="6">6 Months</button><button data-count="12">12 Months</button><button onclick="moveMonths(1)">Next ›</button></div>
    <div id="profile" class="profile"></div>
    <div id="months" class="months"></div>
    <div class="legend"><span><i style="background:var(--selected)"></i>Selected</span><span><i style="background:var(--existing)"></i>Already recorded</span><span><i style="background:var(--weekend)"></i>Weekend · 0 credit</span><span><i style="background:var(--holiday);border-color:#d93025"></i>Regular holiday · 0 credit</span></div>
    <div class="entry-controls"><div><label>Record Notes</label><textarea id="remarks" rows="2" placeholder="Optional historical note"></textarea></div><div><label>Selected Credits</label><input id="selectedCredits" value="0.000" readonly></div></div>
    <button class="primary" onclick="addLeaveToDraft()">＋ Add Leave to Draft</button>
    <div id="status" class="status"></div>
  </section>
  <aside id="draftPanel" class="card draft-panel" tabindex="0">
    <div class="draft-head"><div><div class="draft-title">Draft Leave History</div><div id="draftMeta" class="draft-meta">0 entries · 0.000 credits</div></div><button id="pinButton" class="pin">Pin</button></div>
    <div class="draft-body"><div id="draftEntries"></div><div class="draft-actions"><button onclick="clearDraft(event)">Clear Draft</button><button onclick="exportDraft(event)">Copy Summary</button><button class="complete" onclick="completeDraft(event)">Complete Leave History</button></div><div class="save-note">Draft is autosaved in this browser and restored after refresh.</div></div>
  </aside>
</main>
<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DRAFT_KEY='leave-webapp-draft-v3',PIN_KEY='leaveWebAppDraftPanelPinned';
let start=new Date(new Date().getFullYear(),new Date().getMonth(),1),monthCount=3,selected=new Set(),existing=new Set(),holidays=new Set(),draft=[];
const employee=document.getElementById('employee'),assumptionDate=document.getElementById('assumptionDate'),saveDateButton=document.getElementById('saveDateButton'),leaveType=document.getElementById('leaveType'),credit=document.getElementById('credit'),panel=document.getElementById('draftPanel'),pinButton=document.getElementById('pinButton');let pinned=localStorage.getItem(PIN_KEY)==='true',previewToken=0;
function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function setStatus(msg,cls=''){const el=document.getElementById('status');el.textContent=msg;el.className='status '+cls}
function saveDraft(){localStorage.setItem(DRAFT_KEY,JSON.stringify({employeeId:employee.value,leaveType:leaveType.value,credit:credit.value,remarks:document.getElementById('remarks').value,start:start.toISOString(),monthCount,draft}))}
function restoreDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');draft=d.draft||[];monthCount=d.monthCount||3;if(d.start)start=new Date(d.start);leaveType.value=d.leaveType||'VL';credit.value=d.credit||'1';document.getElementById('remarks').value=d.remarks||'';if(d.employeeId)employee.value=d.employeeId}catch(e){}renderDraft()}
function load(){selected.clear();google.script.run.withSuccessHandler(data=>{existing.clear();holidays.clear();(data.months||[]).forEach(m=>{(m.existingRecords||[]).forEach(r=>existing.add(r.date));(m.holidays||[]).forEach(h=>holidays.add(h.date))});renderProfile(data.profile);if(data.profile){assumptionDate.value=data.profile.assumptionDate||'';assumptionDate.disabled=false;saveDateButton.disabled=false}else if(employee.value){assumptionDate.value='';assumptionDate.disabled=false;saveDateButton.disabled=false}renderMonths()}).withFailureHandler(e=>setStatus(e.message||String(e),'error')).getWebAppCalendarData(employee.value,start.getFullYear(),start.getMonth(),monthCount)}
function renderProfile(p){const el=document.getElementById('profile');if(!p){el.innerHTML='<div class="service-note">Select an employee and enter the Date of Assumption to compute CSC leave credits.</div>';return}el.innerHTML=`<div class="metric"><span>Opening VL</span><strong>${Number(p.openingVl||0).toFixed(3)}</strong></div><div class="metric"><span>Opening SL</span><strong>${Number(p.openingSl||0).toFixed(3)}</strong></div><div class="metric"><span>Current VL</span><strong>${Number(p.balanceVl||0).toFixed(3)}</strong></div><div class="metric"><span>Current SL</span><strong>${Number(p.balanceSl||0).toFixed(3)}</strong></div><div class="service-note">Computed as of ${p.asOfDate||'today'} using the saved Date of Assumption.</div>`}
function previewAssumptionDate(){if(!employee.value||!assumptionDate.value)return;const token=++previewToken;setStatus('Calculating CSC leave credits...');google.script.run.withSuccessHandler(p=>{if(token!==previewToken)return;renderProfile(p);setStatus('Preview updated. Click Save Date to store this Date of Assumption.','success')}).withFailureHandler(e=>setStatus(e.message||String(e),'error')).previewEmployeeCscCredits({employeeId:employee.value,assumptionDate:assumptionDate.value})}
function saveAssumptionDate(){if(!employee.value)return setStatus('Select an employee.','error');if(!assumptionDate.value)return setStatus('Enter the Date of Assumption / Entry.','error');saveDateButton.disabled=true;saveDateButton.textContent='Saving...';google.script.run.withSuccessHandler(r=>{saveDateButton.disabled=false;saveDateButton.textContent='Save Date';renderProfile(r.profile);setStatus(r.message,'success')}).withFailureHandler(e=>{saveDateButton.disabled=false;saveDateButton.textContent='Save Date';setStatus(e.message||String(e),'error')}).saveEmployeeProfile({employeeId:employee.value,assumptionDate:assumptionDate.value})}
function renderMonths(){const root=document.getElementById('months');root.innerHTML='';for(let i=0;i<monthCount;i++){const dt=new Date(start.getFullYear(),start.getMonth()+i,1),y=dt.getFullYear(),m=dt.getMonth(),first=dt.getDay(),days=new Date(y,m+1,0).getDate(),box=document.createElement('div');box.className='month';box.innerHTML=`<h3>${MONTHS[m]} ${y}</h3><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>`;const grid=document.createElement('div');grid.className='days';for(let x=0;x<first;x++){const b=document.createElement('button');b.className='day empty';grid.appendChild(b)}for(let d=1;d<=days;d++){const date=new Date(y,m,d),key=iso(y,m,d),b=document.createElement('button');b.className='day';b.textContent=d;if(date.getDay()===0||date.getDay()===6)b.classList.add('weekend');if(holidays.has(key))b.classList.add('holiday');if(existing.has(key))b.classList.add('existing');if(selected.has(key))b.classList.add('selected');b.onclick=()=>toggleDate(key);grid.appendChild(b)}box.appendChild(grid);root.appendChild(box)}updateSelectedCredits()}
function toggleDate(key){if(existing.has(key))return setStatus('That date already has a saved leave record.','error');selected.has(key)?selected.delete(key):selected.add(key);renderMonths()}
function dateCredit(key){const [y,m,d]=key.split('-').map(Number),dt=new Date(y,m-1,d);return dt.getDay()===0||dt.getDay()===6||holidays.has(key)?0:Number(credit.value)}
function updateSelectedCredits(){document.getElementById('selectedCredits').value=[...selected].reduce((s,k)=>s+dateCredit(k),0).toFixed(3)}
function addLeaveToDraft(){if(!employee.value)return setStatus('Select an employee.','error');if(!assumptionDate.value)return setStatus('Enter and save the Date of Assumption first.','error');if(!selected.size)return setStatus('Select at least one date.','error');const dates=[...selected].sort().map(k=>({date:k,credits:dateCredit(k)}));draft.push({id:Date.now(),leaveType:leaveType.value,remarks:document.getElementById('remarks').value.trim(),dates});selected.clear();document.getElementById('remarks').value='';renderDraft();renderMonths();setStatus('Leave added to draft.','success')}
function renderDraft(){const root=document.getElementById('draftEntries');root.innerHTML='';let total=0;draft.forEach(e=>{const credits=e.dates.reduce((s,d)=>s+Number(d.credits||0),0);total+=credits;const row=document.createElement('div');row.className='draft-entry';row.innerHTML=`<div class="tag">${e.leaveType}</div><div>${e.dates[0].date}${e.dates.length>1?' → '+e.dates[e.dates.length-1].date:''}<br><small>${e.dates.length} date(s)</small></div><div>${credits.toFixed(3)}</div><button class="delete" onclick="deleteEntry(event,${e.id})">×</button>`;root.appendChild(row)});document.getElementById('draftMeta').textContent=`${draft.length} entr${draft.length===1?'y':'ies'} · ${total.toFixed(3)} credits`;renderPanel();saveDraft()}
function deleteEntry(ev,id){ev.stopPropagation();draft=draft.filter(e=>e.id!==id);renderDraft()}function clearDraft(ev){ev.stopPropagation();if(confirm('Clear all draft entries?')){draft=[];renderDraft()}}function exportDraft(ev){ev.stopPropagation();const text=draft.map((e,i)=>`${i+1}. ${e.leaveType} — ${e.dates.map(d=>d.date).join(', ')}`).join('\n');navigator.clipboard.writeText(text);setStatus('Draft summary copied.','success')}
function completeDraft(ev){ev.stopPropagation();if(!employee.value||!draft.length)return setStatus('Select an employee and add draft entries.','error');if(!confirm('Write all draft entries to Leave Records?'))return;const opt=employee.options[employee.selectedIndex];google.script.run.withSuccessHandler(r=>{setStatus(r.message,'success');draft=[];renderDraft();load()}).withFailureHandler(e=>setStatus(e.message||String(e),'error')).completeWebAppDraft({employeeId:employee.value,name:opt?.dataset?.name||'',entries:draft})}
function moveMonths(n){start=new Date(start.getFullYear(),start.getMonth()+n,1);load();saveDraft()}
document.querySelectorAll('.views button[data-count]').forEach(b=>b.onclick=()=>{monthCount=Number(b.dataset.count);document.querySelectorAll('.views button[data-count]').forEach(x=>x.classList.toggle('active',x===b));load();saveDraft()});employee.onchange=()=>{assumptionDate.value='';assumptionDate.disabled=!employee.value;saveDateButton.disabled=!employee.value;load();saveDraft()};assumptionDate.onchange=previewAssumptionDate;assumptionDate.oninput=()=>setTimeout(previewAssumptionDate,120);leaveType.onchange=saveDraft;credit.onchange=()=>{updateSelectedCredits();saveDraft()};document.getElementById('remarks').oninput=saveDraft;
function renderPanel(){panel.classList.toggle('pinned',pinned);panel.classList.toggle('expanded',pinned||panel.classList.contains('manual-open'));pinButton.textContent=pinned?'Pinned':'Pin'}pinButton.onclick=e=>{e.stopPropagation();pinned=!pinned;localStorage.setItem(PIN_KEY,String(pinned));panel.classList.remove('manual-open');renderPanel()};panel.onclick=e=>{if(e.target.closest('button'))return;if(matchMedia('(hover:none),(pointer:coarse)').matches){panel.classList.toggle('manual-open');renderPanel()}};
google.script.run.withSuccessHandler(data=>{employee.innerHTML='<option value="">Select employee</option>';(data.employees||[]).forEach(x=>{const o=new Option(`${x.name} (${x.employeeId})`,x.employeeId);o.dataset.name=x.name;employee.add(o)});restoreDraft();document.querySelectorAll('.views button[data-count]').forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===monthCount));assumptionDate.disabled=!employee.value;saveDateButton.disabled=!employee.value;load()}).getWebAppBootstrap();renderPanel();
</script>
</body>
</html>
