<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{--primary:#1a73e8;--border:#dadce0;--muted:#5f6368;--selected:#d2e3fc;--existing:#fce8e6;--holiday:#fce8e6;--weekend:#f1f3f4}
    *{box-sizing:border-box}body{margin:0;padding:14px;font-family:Arial,sans-serif;color:#202124;background:#fff}h2{margin:0 0 14px;font-size:20px}
    label{display:block;margin:10px 0 5px;font-size:12px;font-weight:700}select,input,textarea,button{width:100%;font:inherit}select,input,textarea{padding:9px;border:1px solid var(--border);border-radius:6px;background:#fff}textarea{resize:vertical;min-height:60px}
    .calendar-header{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin:16px 0 8px}.calendar-header button{border:0;background:transparent;font-size:20px;cursor:pointer}.calendar-header div{text-align:center;font-weight:700}
    .weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekdays div{text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:4px 0}
    .day{min-height:40px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;position:relative}.day:hover{border-color:var(--primary)}.day.empty{border-color:transparent;cursor:default}.day.selected{background:var(--selected);border-color:var(--primary)}.day.existing{background:var(--existing)}
    .day.weekend,.day.holiday{cursor:not-allowed;color:#80868b}.day.weekend{background:var(--weekend)}.day.holiday{background:var(--holiday);color:#b3261e;font-weight:700}.day.holiday::after{content:"H";position:absolute;right:4px;bottom:2px;font-size:9px}.day.existing::before{content:"•";position:absolute;right:4px;top:-2px;color:#d93025;font-size:18px}
    .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;border:1px solid var(--border);vertical-align:-1px}.selected-key::before{background:var(--selected)}.existing-key::before{background:var(--existing)}.weekend-key::before{background:var(--weekend)}.holiday-key::before{background:var(--holiday)}
    .summary{margin:12px 0;padding:10px;border-radius:6px;background:#f8f9fa;font-size:13px}.credit-row{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:end}.save{margin-top:14px;padding:10px;border:0;border-radius:6px;color:#fff;background:var(--primary);font-weight:700;cursor:pointer}.save:disabled{opacity:.55;cursor:wait}#status{margin-top:10px;font-size:12px;min-height:18px}.error{color:#d93025}.success{color:#188038}
    .dev-panel{margin-top:18px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);line-height:1.5}.dev-title{font-weight:700;color:#3c4043}.dev-ok{color:#188038;font-weight:700}
  </style>
</head>
<body>
  <h2>Leave Encoder</h2>
  <label for="employee">Employee</label><select id="employee"><option value="">Loading employees...</option></select>
  <label for="leaveType">Type of Leave</label>
  <select id="leaveType"><option value="VL">Vacation Leave</option><option value="SL">Sick Leave</option><option value="FL">Forced Leave</option><option value="SPL">Special Privilege Leave</option><option value="CTO">Compensatory Time Off</option><option value="Other">Other</option></select>

  <div class="calendar-header"><button type="button" onclick="changeMonth(-1)">‹</button><div id="monthLabel"></div><button type="button" onclick="changeMonth(1)">›</button></div>
  <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
  <div id="calendar" class="calendar"></div>
  <div class="legend"><span class="selected-key">Selected</span><span class="existing-key">Already saved</span><span class="weekend-key">Weekend</span><span class="holiday-key">Regular holiday</span></div>

  <div id="summary" class="summary">No dates selected.</div>
  <div class="credit-row"><div><label for="credit">Credit per selected date</label><select id="credit"><option value="1">1.00 — Whole day</option><option value="0.5">0.50 — Half day</option></select></div><div><label>Total</label><input id="totalCredits" value="0.00" readonly></div></div>
  <label for="remarks">Remarks</label><textarea id="remarks" placeholder="Optional"></textarea>
  <button id="saveButton" class="save" onclick="saveRecords()">Save Leave Records</button><div id="status"></div>

  <div class="dev-panel"><div class="dev-title" id="devName">Leave Encoder</div><div>Version: <span id="devVersion">loading</span></div><div>Build: <span id="devBuild">loading</span></div><div>Branch: <span id="devBranch">loading</span></div><div>Source commit: <span id="devCommit">loading</span></div><div class="dev-ok">Connected ✓</div></div>

<script>
  let viewDate=new Date();viewDate.setDate(1);
  const selectedDates=new Set(),existingDates=new Set(),holidayMap=new Map();

  document.getElementById('employee').addEventListener('change',()=>{selectedDates.clear();loadMonthData()});
  document.getElementById('credit').addEventListener('change',updateSummary);

  function init(){
    google.script.run.withSuccessHandler(renderEmployees).withFailureHandler(showError).getEmployees();
    google.script.run.withSuccessHandler(renderAppInfo).withFailureHandler(()=>{}).getAppInfo();
    loadMonthData();
  }

  function renderAppInfo(info){document.getElementById('devName').textContent=info.name;document.getElementById('devVersion').textContent=info.version;document.getElementById('devBuild').textContent=info.buildDate;document.getElementById('devBranch').textContent=info.branch;document.getElementById('devCommit').textContent=info.sourceCommit}

  function renderEmployees(items){const select=document.getElementById('employee');select.innerHTML='<option value="">Select employee</option>';items.forEach(e=>{const o=document.createElement('option');o.value=e.employeeId;o.textContent=`${e.name} (${e.employeeId})`;o.dataset.name=e.name;select.appendChild(o)})}

  function changeMonth(offset){viewDate.setMonth(viewDate.getMonth()+offset);selectedDates.clear();loadMonthData()}

  function loadMonthData(){
    existingDates.clear();holidayMap.clear();
    const year=viewDate.getFullYear(),month=viewDate.getMonth(),employeeId=document.getElementById('employee').value;
    let pending=employeeId?2:1;
    const done=()=>{pending--;if(pending===0)renderCalendar()};
    google.script.run.withSuccessHandler(rows=>{rows.forEach(h=>holidayMap.set(h.date,h));done()}).withFailureHandler(showError).getHolidays(year,month);
    if(employeeId){google.script.run.withSuccessHandler(rows=>{rows.forEach(r=>existingDates.add(r.date));done()}).withFailureHandler(showError).getExistingLeaveDates(employeeId,year,month)}
  }

  function renderCalendar(){
    const cal=document.getElementById('calendar');cal.innerHTML='';
    const y=viewDate.getFullYear(),m=viewDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    document.getElementById('monthLabel').textContent=viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    for(let i=0;i<first;i++){const b=document.createElement('button');b.className='day empty';b.disabled=true;cal.appendChild(b)}
    for(let d=1;d<=days;d++){
      const date=new Date(y,m,d),iso=formatLocalDate(date),weekend=date.getDay()===0||date.getDay()===6,holiday=holidayMap.get(iso),b=document.createElement('button');
      b.type='button';b.className='day';b.textContent=d;
      if(weekend)b.classList.add('weekend');
      if(holiday){b.classList.add('holiday');b.title=holiday.name}
      if(selectedDates.has(iso))b.classList.add('selected');
      if(existingDates.has(iso)){b.classList.add('existing');b.title='A leave record already exists for this date'}
      b.onclick=()=>toggleDate(iso,weekend,holiday);cal.appendChild(b);
    }
    updateSummary();
  }

  function toggleDate(iso,weekend,holiday){
    if(weekend){setStatus('Weekend: no leave credit will be deducted.','error');return}
    if(holiday){setStatus(`${holiday.name}: regular holiday, no leave credit will be deducted.`,'error');return}
    if(existingDates.has(iso)){setStatus('This date already has a leave record.','error');return}
    selectedDates.has(iso)?selectedDates.delete(iso):selectedDates.add(iso);renderCalendar();
  }

  function updateSummary(){const count=selectedDates.size,credit=Number(document.getElementById('credit').value);document.getElementById('summary').textContent=count?`${count} working date(s) selected.`:'No dates selected.';document.getElementById('totalCredits').value=(count*credit).toFixed(2)}

  function saveRecords(){
    const employee=document.getElementById('employee'),option=employee.options[employee.selectedIndex],employeeId=employee.value;
    if(!employeeId){showError(new Error('Select an employee.'));return}if(!selectedDates.size){showError(new Error('Select at least one working date.'));return}
    const credit=Number(document.getElementById('credit').value),payload={employeeId,name:option?.dataset?.name||'',leaveType:document.getElementById('leaveType').value,remarks:document.getElementById('remarks').value.trim(),dates:[...selectedDates].sort().map(date=>({date,credits:credit}))};
    setLoading(true);setStatus('Saving...','');
    google.script.run.withSuccessHandler(result=>{setLoading(false);setStatus(result.message,result.success?'success':'error');if(result.success){selectedDates.clear();document.getElementById('remarks').value='';loadMonthData()}}).withFailureHandler(e=>{setLoading(false);showError(e)}).saveLeaveRecords(payload);
  }

  function formatLocalDate(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
  function setLoading(v){const b=document.getElementById('saveButton');b.disabled=v;b.textContent=v?'Saving...':'Save Leave Records'}
  function showError(error){setStatus(error.message||String(error),'error')}
  function setStatus(message,className){const s=document.getElementById('status');s.textContent=message;s.className=className||''}
  init();
</script>
</body>
</html>
