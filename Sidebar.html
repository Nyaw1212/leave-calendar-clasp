<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --primary: #1a73e8;
      --border: #dadce0;
      --muted: #5f6368;
      --selected: #d2e3fc;
      --existing: #fce8e6;
      --weekend: #f1f3f4;
      --holiday: #fce8e6;
      --holiday-border: #d93025;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      font-family: Arial, sans-serif;
      color: #202124;
      background: #fff;
    }

    h2 { margin: 0 0 14px; font-size: 20px; }

    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 12px;
      font-weight: 700;
    }

    select, input, textarea, button { width: 100%; font: inherit; }

    select, input, textarea {
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 56px; }

    .calendar-header {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      margin: 14px 0 8px;
    }

    .calendar-header button {
      border: 0;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }

    #monthLabel { text-align: center; font-weight: 700; }

    .weekdays, .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .weekdays div {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 0;
    }

    .day {
      min-height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      position: relative;
      padding: 0;
    }

    .day:hover { border-color: var(--primary); }
    .day.empty { border-color: transparent; cursor: default; }
    .day.weekend { background: var(--weekend); color: #5f6368; }

    .day.holiday {
      background: var(--holiday);
      border-color: var(--holiday-border);
      color: #b3261e;
      font-weight: 700;
    }

    .day.holiday::before {
      content: "H";
      position: absolute;
      top: 1px;
      right: 3px;
      font-size: 8px;
      font-weight: 700;
      color: var(--holiday-border);
    }

    .day.selected {
      box-shadow: inset 0 0 0 2px var(--primary);
      background: var(--selected);
      color: #174ea6;
    }

    .day.holiday.selected {
      background: #fad2cf;
      box-shadow: inset 0 0 0 2px var(--primary);
    }

    .day.existing::after {
      content: "•";
      position: absolute;
      right: 3px;
      bottom: -3px;
      color: #8e24aa;
      font-size: 18px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 10px;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 4px;
      border: 1px solid var(--border);
      vertical-align: -1px;
    }

    .selected-key::before { background: var(--selected); }
    .existing-key::before { background: var(--existing); }
    .weekend-key::before { background: var(--weekend); }
    .holiday-key::before { background: var(--holiday); border-color: var(--holiday-border) !important; }

    .summary {
      margin: 11px 0;
      padding: 9px;
      border-radius: 6px;
      background: #f8f9fa;
      font-size: 12px;
      line-height: 1.4;
    }

    .credit-row {
      display: grid;
      grid-template-columns: 1fr 92px;
      gap: 8px;
      align-items: end;
    }

    .save {
      margin-top: 13px;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    .save:disabled { opacity: .55; cursor: wait; }

    #status {
      margin-top: 9px;
      font-size: 12px;
      min-height: 18px;
      line-height: 1.4;
    }

    .error { color: #d93025; }
    .success { color: #188038; }

    .dev-footer {
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 9px;
      font-size: 10px;
      line-height: 1.45;
      color: var(--muted);
    }

    .dev-footer strong { color: #3c4043; }
    .connected { color: #188038; font-weight: 700; }
  </style>
</head>
<body>
  <h2>Leave Encoder</h2>

  <label for="employee">Employee</label>
  <select id="employee"><option value="">Loading employees...</option></select>

  <label for="leaveType">Type of Leave</label>
  <select id="leaveType">
    <option value="VL">Vacation Leave</option>
    <option value="SL">Sick Leave</option>
    <option value="FL">Forced Leave</option>
    <option value="SPL">Special Privilege Leave</option>
    <option value="CTO">Compensatory Time Off</option>
    <option value="Other">Other</option>
  </select>

  <div class="calendar-header">
    <button type="button" onclick="changeMonth(-1)">‹</button>
    <div id="monthLabel"></div>
    <button type="button" onclick="changeMonth(1)">›</button>
  </div>

  <div class="weekdays">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
    <div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div id="calendar" class="calendar"></div>

  <div class="legend">
    <span class="selected-key">Selected</span>
    <span class="existing-key">Already saved</span>
    <span class="weekend-key">Weekend · 0 credit</span>
    <span class="holiday-key">Regular holiday · 0 credit</span>
  </div>

  <div id="summary" class="summary">No dates selected.</div>

  <div class="credit-row">
    <div>
      <label for="credit">Credit per working date</label>
      <select id="credit">
        <option value="1">1.00 — Whole day</option>
        <option value="0.5">0.50 — Half day</option>
      </select>
    </div>
    <div>
      <label>Total</label>
      <input id="totalCredits" value="0.00" readonly>
    </div>
  </div>

  <label for="remarks">Remarks</label>
  <textarea id="remarks" placeholder="Optional"></textarea>

  <button id="saveButton" class="save" onclick="saveRecords()">Save Leave Records</button>
  <div id="status"></div>

  <div class="dev-footer">
    <div><strong id="appName">Leave Encoder</strong></div>
    <div>Version: <span id="appVersion">—</span></div>
    <div>Build: <span id="buildDate">—</span></div>
    <div>Branch: <span id="branch">—</span></div>
    <div>Source commit: <span id="sourceCommit">—</span></div>
    <div id="connectionStatus">Connecting...</div>
  </div>

  <script>
    let viewDate = new Date();
    viewDate.setDate(1);

    const selectedDates = new Set();
    const existingDates = new Set();
    const holidays = new Map();

    document.getElementById('employee').addEventListener('change', () => {
      selectedDates.clear();
      loadCalendarData();
    });

    document.getElementById('credit').addEventListener('change', updateSummary);

    function init() {
      google.script.run
        .withSuccessHandler(renderEmployees)
        .withFailureHandler(showError)
        .getEmployees();

      google.script.run
        .withSuccessHandler(renderAppInfo)
        .withFailureHandler(() => {
          document.getElementById('connectionStatus').textContent = 'Build info unavailable';
        })
        .getAppInfo();

      loadCalendarData();
    }

    function renderEmployees(employees) {
      const select = document.getElementById('employee');
      select.innerHTML = '<option value="">Select employee</option>';

      employees.forEach(employee => {
        const option = document.createElement('option');
        option.value = employee.employeeId;
        option.textContent = `${employee.name} (${employee.employeeId})`;
        option.dataset.name = employee.name;
        select.appendChild(option);
      });
    }

    function renderAppInfo(info) {
      document.getElementById('appName').textContent = info.name || 'Leave Encoder';
      document.getElementById('appVersion').textContent = info.version || '—';
      document.getElementById('buildDate').textContent = info.buildDate || '—';
      document.getElementById('branch').textContent = info.branch || '—';
      document.getElementById('sourceCommit').textContent = info.sourceCommit || '—';
      const status = document.getElementById('connectionStatus');
      status.textContent = 'Connected ✓';
      status.className = 'connected';
    }

    function changeMonth(offset) {
      viewDate.setMonth(viewDate.getMonth() + offset);
      selectedDates.clear();
      loadCalendarData();
    }

    function loadCalendarData() {
      existingDates.clear();
      holidays.clear();

      const employeeId = document.getElementById('employee').value;

      google.script.run
        .withSuccessHandler(data => {
          (data.existingRecords || []).forEach(record => existingDates.add(record.date));
          (data.holidays || []).forEach(holiday => holidays.set(holiday.date, holiday));
          renderCalendar();
        })
        .withFailureHandler(showError)
        .getCalendarData(employeeId, viewDate.getFullYear(), viewDate.getMonth());
    }

    function renderCalendar() {
      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      document.getElementById('monthLabel').textContent =
        viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('button');
        empty.className = 'day empty';
        empty.disabled = true;
        calendar.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const iso = formatLocalDate(date);
        const button = document.createElement('button');
        const holiday = holidays.get(iso);
        const isWeekend = date.getDay() === 0 || date.getDay() === 6;

        button.type = 'button';
        button.className = 'day';
        button.textContent = day;

        if (isWeekend) button.classList.add('weekend');
        if (holiday) {
          button.classList.add('holiday');
          button.title = `${holiday.name} — Regular Holiday — 0.00 credit`;
        } else if (isWeekend) {
          button.title = 'Weekend — 0.00 credit';
        }

        if (selectedDates.has(iso)) button.classList.add('selected');
        if (existingDates.has(iso)) {
          button.classList.add('existing');
          button.title = `${button.title ? button.title + '\n' : ''}A leave record already exists.`;
        }

        button.onclick = () => toggleDate(iso);
        calendar.appendChild(button);
      }

      updateSummary();
    }

    function toggleDate(iso) {
      if (existingDates.has(iso)) {
        setStatus('This date already has a leave record.', 'error');
        return;
      }

      if (selectedDates.has(iso)) selectedDates.delete(iso);
      else selectedDates.add(iso);

      setStatus('', '');
      renderCalendar();
    }

    function getDateCredit(iso) {
      const [year, month, day] = iso.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      const isWeekend = date.getDay() === 0 || date.getDay() === 6;
      const isHoliday = holidays.has(iso);
      return isWeekend || isHoliday
        ? 0
        : Number(document.getElementById('credit').value);
    }

    function updateSummary() {
      const dates = [...selectedDates];
      const zeroCreditCount = dates.filter(date => getDateCredit(date) === 0).length;
      const workingCount = dates.length - zeroCreditCount;
      const total = dates.reduce((sum, date) => sum + getDateCredit(date), 0);

      document.getElementById('summary').textContent = dates.length
        ? `${dates.length} date(s) selected: ${workingCount} working date(s), ${zeroCreditCount} weekend/regular holiday date(s) at 0.00 credit.`
        : 'No dates selected.';

      document.getElementById('totalCredits').value = total.toFixed(2);
    }

    function saveRecords() {
      const employeeSelect = document.getElementById('employee');
      const selectedOption = employeeSelect.options[employeeSelect.selectedIndex];
      const employeeId = employeeSelect.value;
      const name = selectedOption?.dataset?.name || '';

      if (!employeeId) return showError(new Error('Select an employee.'));
      if (!selectedDates.size) return showError(new Error('Select at least one date.'));

      const payload = {
        employeeId,
        name,
        leaveType: document.getElementById('leaveType').value,
        remarks: document.getElementById('remarks').value.trim(),
        dates: [...selectedDates]
          .sort()
          .map(date => ({ date, credits: getDateCredit(date) }))
      };

      setLoading(true);
      setStatus('Saving...', '');

      google.script.run
        .withSuccessHandler(result => {
          setLoading(false);
          setStatus(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            selectedDates.clear();
            document.getElementById('remarks').value = '';
            loadCalendarData();
          }
        })
        .withFailureHandler(error => {
          setLoading(false);
          showError(error);
        })
        .saveLeaveRecords(payload);
    }

    function formatLocalDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setLoading(isLoading) {
      const button = document.getElementById('saveButton');
      button.disabled = isLoading;
      button.textContent = isLoading ? 'Saving...' : 'Save Leave Records';
    }

    function showError(error) {
      setStatus(error.message || String(error), 'error');
    }

    function setStatus(message, className) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = className || '';
    }

    init();
  </script>
</body>
</html>
